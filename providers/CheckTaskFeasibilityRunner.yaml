%YAML 1.1
---
name: CheckTaskFeasibilityRunner
spec_type: provider
spec_version: 1.2
description: "The provider for mobile-manipulator task-feasibility queries."
implements: mobile_manipulator_capabilities/CheckTaskFeasibilityRunner
runner: capabilities2_runner::CheckTaskFeasibilityRunner

definition:
  command: "<Runner interface=mobile_manipulator_capabilities/CheckTaskFeasibilityRunner provider=mobile_manipulator_capabilities/CheckTaskFeasibilityRunner x='$x' y='$y' z='$z' qx='$qx' qy='$qy' qz='$qz' qw='$qw' frame_id='$frame_id' mode='$mode' base_pose_valid='$base_pose_valid' base_x='$base_x' base_y='$base_y' base_z='$base_z' base_qx='$base_qx' base_qy='$base_qy' base_qz='$base_qz' base_qw='$base_qw' base_frame_id='$base_frame_id' />"
  configuration_parameters:
    - name: x
      type: double
      semantic_key: mobile_manipulator.task_pose.x
      description: "Target x position in the supplied frame."
    - name: y
      type: double
      semantic_key: mobile_manipulator.task_pose.y
      description: "Target y position in the supplied frame."
    - name: z
      type: double
      semantic_key: mobile_manipulator.task_pose.z
      description: "Target z position in the supplied frame."
    - name: qx
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.task_pose.qx
      description: "Target orientation quaternion x component."
    - name: qy
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.task_pose.qy
      description: "Target orientation quaternion y component."
    - name: qz
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.task_pose.qz
      description: "Target orientation quaternion z component."
    - name: qw
      type: double
      optional: true
      default: 1.0
      semantic_key: mobile_manipulator.task_pose.qw
      description: "Target orientation quaternion w component."
    - name: frame_id
      type: string
      optional: true
      default: "map"
      semantic_key: mobile_manipulator.task_pose.frame_id
      description: "Frame in which the task pose is expressed."
    - name: mode
      type: string
      optional: true
      default: "mobile_manipulator"
      semantic_key: mobile_manipulator.mode
      description: "Feasibility mode such as arm_only_ik, arm_only_plan, or mobile_manipulator."
    - name: base_pose_valid
      type: bool
      optional: true
      default: false
      semantic_key: mobile_manipulator.base_pose_valid
      description: "Whether a specific base pose is supplied for validation."
    - name: base_x
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.base_pose.x
      description: "Supplied base pose x position."
    - name: base_y
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.base_pose.y
      description: "Supplied base pose y position."
    - name: base_z
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.base_pose.z
      description: "Supplied base pose z position."
    - name: base_qx
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.base_pose.qx
      description: "Supplied base pose quaternion x component."
    - name: base_qy
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.base_pose.qy
      description: "Supplied base pose quaternion y component."
    - name: base_qz
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.base_pose.qz
      description: "Supplied base pose quaternion z component."
    - name: base_qw
      type: double
      optional: true
      default: 1.0
      semantic_key: mobile_manipulator.base_pose.qw
      description: "Supplied base pose quaternion w component."
    - name: base_frame_id
      type: string
      optional: true
      default: ""
      semantic_key: mobile_manipulator.base_pose.frame_id
      description: "Frame in which the supplied base pose is expressed."
  runtime_parameters:
    output:
      - name: feasible
        type: bool
        semantic_key: mobile_manipulator.feasibility.feasible
        description: "Whether the requested task is feasible under the selected mode."
      - name: mode_used
        type: string
        semantic_key: mobile_manipulator.feasibility.mode_used
        description: "Feasibility mode actually used by the mobile-manipulator backend."
      - name: failure_reason
        type: string
        semantic_key: mobile_manipulator.feasibility.failure_reason
        description: "Machine-readable reason for infeasibility when feasible=false."
      - name: suggested_fallback
        type: string
        semantic_key: mobile_manipulator.feasibility.suggested_fallback
        description: "Recommended fallback action when feasible=false."
      - name: message
        type: string
        semantic_key: mobile_manipulator.feasibility.message
        description: "Human-readable feasibility result message."
      - name: planning_frame
        type: string
        semantic_key: mobile_manipulator.feasibility.planning_frame
        description: "Planning frame used by the backend evaluation."
      - name: planning_pose_valid
        type: bool
        semantic_key: mobile_manipulator.feasibility.planning_pose_valid
        description: "Whether the returned planning pose is valid."
      - name: planning_x
        type: double
        semantic_key: mobile_manipulator.feasibility.planning_pose.x
        description: "Normalized planning pose x position."
      - name: planning_y
        type: double
        semantic_key: mobile_manipulator.feasibility.planning_pose.y
        description: "Normalized planning pose y position."
      - name: planning_z
        type: double
        semantic_key: mobile_manipulator.feasibility.planning_pose.z
        description: "Normalized planning pose z position."
      - name: planning_qx
        type: double
        semantic_key: mobile_manipulator.feasibility.planning_pose.qx
        description: "Normalized planning pose quaternion x component."
      - name: planning_qy
        type: double
        semantic_key: mobile_manipulator.feasibility.planning_pose.qy
        description: "Normalized planning pose quaternion y component."
      - name: planning_qz
        type: double
        semantic_key: mobile_manipulator.feasibility.planning_pose.qz
        description: "Normalized planning pose quaternion z component."
      - name: planning_qw
        type: double
        semantic_key: mobile_manipulator.feasibility.planning_pose.qw
        description: "Normalized planning pose quaternion w component."
      - name: base_target_frame
        type: string
        semantic_key: mobile_manipulator.feasibility.base_target_frame
        description: "Frame of the returned base target pose."
      - name: base_target_pose_valid
        type: bool
        semantic_key: mobile_manipulator.feasibility.base_target_pose_valid
        description: "Whether the returned base target pose is valid."
      - name: base_target_x
        type: double
        semantic_key: mobile_manipulator.feasibility.base_target_pose.x
        description: "Returned base target pose x position."
      - name: base_target_y
        type: double
        semantic_key: mobile_manipulator.feasibility.base_target_pose.y
        description: "Returned base target pose y position."
      - name: base_target_z
        type: double
        semantic_key: mobile_manipulator.feasibility.base_target_pose.z
        description: "Returned base target pose z position."
      - name: base_target_qx
        type: double
        semantic_key: mobile_manipulator.feasibility.base_target_pose.qx
        description: "Returned base target pose quaternion x component."
      - name: base_target_qy
        type: double
        semantic_key: mobile_manipulator.feasibility.base_target_pose.qy
        description: "Returned base target pose quaternion y component."
      - name: base_target_qz
        type: double
        semantic_key: mobile_manipulator.feasibility.base_target_pose.qz
        description: "Returned base target pose quaternion z component."
      - name: base_target_qw
        type: double
        semantic_key: mobile_manipulator.feasibility.base_target_pose.qw
        description: "Returned base target pose quaternion w component."
      - name: candidate_score
        type: double
        semantic_key: mobile_manipulator.feasibility.candidate_score
        description: "Score assigned to the selected candidate solution."

relations:
  - subject: mobile_manipulator_capabilities/CheckTaskFeasibilityRunner
    predicate: replaces
    object: grasping_capabilities/CheckCartesianFeasibilityRunner
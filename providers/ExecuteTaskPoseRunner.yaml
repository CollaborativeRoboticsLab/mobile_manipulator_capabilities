%YAML 1.1
---
name: ExecuteTaskPoseRunner
spec_type: provider
spec_version: 1.2
description: "Thin action-client provider for the mobile-manipulator coordinator execution flow."
implements: mobile_manipulator_capabilities/ExecuteTaskPoseRunner
runner: capabilities2_runner::ExecuteTaskPoseRunner

definition:
  command: "<Runner interface=mobile_manipulator_capabilities/ExecuteTaskPoseRunner provider=mobile_manipulator_capabilities/ExecuteTaskPoseRunner x='$x' y='$y' z='$z' qx='$qx' qy='$qy' qz='$qz' qw='$qw' frame_id='$frame_id' mode='$mode' validated='$validated' approved_base_pose_valid='$approved_base_pose_valid' approved_base_x='$approved_base_x' approved_base_y='$approved_base_y' approved_base_z='$approved_base_z' approved_base_qx='$approved_base_qx' approved_base_qy='$approved_base_qy' approved_base_qz='$approved_base_qz' approved_base_qw='$approved_base_qw' approved_base_frame='$approved_base_frame' />"
  configuration_parameters:
    - name: x
      type: double
      semantic_key: mobile_manipulator.execute_pose.x
      description: "Target x position in the supplied frame."
    - name: y
      type: double
      semantic_key: mobile_manipulator.execute_pose.y
      description: "Target y position in the supplied frame."
    - name: z
      type: double
      semantic_key: mobile_manipulator.execute_pose.z
      description: "Target z position in the supplied frame."
    - name: qx
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.qx
      description: "Target orientation quaternion x component."
    - name: qy
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.qy
      description: "Target orientation quaternion y component."
    - name: qz
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.qz
      description: "Target orientation quaternion z component."
    - name: qw
      type: double
      optional: true
      default: 1.0
      semantic_key: mobile_manipulator.execute_pose.qw
      description: "Target orientation quaternion w component."
    - name: frame_id
      type: string
      optional: true
      default: "map"
      semantic_key: mobile_manipulator.execute_pose.frame_id
      description: "Frame in which the target pose is expressed."
    - name: mode
      type: string
      optional: true
      default: "mobile_manipulator"
      semantic_key: mobile_manipulator.execute_pose.mode
      description: "Execution mode associated with the approved solution."
    - name: validated
      type: bool
      optional: true
      default: false
      semantic_key: mobile_manipulator.execute_pose.validated
      description: "Whether the supplied execution solution was validated before invoking the action."
    - name: approved_base_pose_valid
      type: bool
      optional: true
      default: false
      semantic_key: mobile_manipulator.execute_pose.approved_base_pose_valid
      description: "Whether an approved base pose accompanies the target pose."
    - name: approved_base_x
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.approved_base_x
      description: "Approved base pose x position."
    - name: approved_base_y
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.approved_base_y
      description: "Approved base pose y position."
    - name: approved_base_z
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.approved_base_z
      description: "Approved base pose z position."
    - name: approved_base_qx
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.approved_base_qx
      description: "Approved base pose quaternion x component."
    - name: approved_base_qy
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.approved_base_qy
      description: "Approved base pose quaternion y component."
    - name: approved_base_qz
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.approved_base_qz
      description: "Approved base pose quaternion z component."
    - name: approved_base_qw
      type: double
      optional: true
      default: 1.0
      semantic_key: mobile_manipulator.execute_pose.approved_base_qw
      description: "Approved base pose quaternion w component."
    - name: approved_base_frame
      type: string
      optional: true
      default: ""
      semantic_key: mobile_manipulator.execute_pose.approved_base_frame
      description: "Frame in which the approved base pose is expressed."
  runtime_parameters:
    output:
      - name: success
        type: bool
        semantic_key: mobile_manipulator.execute_pose.success
        description: "Whether the execution action completed successfully."
      - name: feasible
        type: bool
        semantic_key: mobile_manipulator.execute_pose.feasible
        description: "Whether the validated execution request remained feasible."
      - name: mode_used
        type: string
        semantic_key: mobile_manipulator.execute_pose.mode_used
        description: "Execution or validation mode actually used by the backend."
      - name: message
        type: string
        semantic_key: mobile_manipulator.execute_pose.message
        description: "Human-readable execution outcome message."
      - name: failure_reason
        type: string
        semantic_key: mobile_manipulator.execute_pose.failure_reason
        description: "Machine-readable failure reason when execution fails."
      - name: suggested_fallback
        type: string
        semantic_key: mobile_manipulator.execute_pose.suggested_fallback
        description: "Recommended fallback action when execution fails."
      - name: stage
        type: string
        semantic_key: mobile_manipulator.execute_pose.stage
        description: "Coordinator-reported terminal stage such as completed, checking_feasibility, navigating, rechecking, or moving_arm."
      - name: planning_frame
        type: string
        semantic_key: mobile_manipulator.execute_pose.planning_frame
        description: "Planning frame used by the backend evaluation."
      - name: planning_pose_valid
        type: bool
        semantic_key: mobile_manipulator.execute_pose.planning_pose_valid
        description: "Whether the returned planning pose is valid."
      - name: planning_x
        type: double
        semantic_key: mobile_manipulator.execute_pose.planning_pose.x
        description: "Normalized planning pose x position."
      - name: planning_y
        type: double
        semantic_key: mobile_manipulator.execute_pose.planning_pose.y
        description: "Normalized planning pose y position."
      - name: planning_z
        type: double
        semantic_key: mobile_manipulator.execute_pose.planning_pose.z
        description: "Normalized planning pose z position."
      - name: planning_qx
        type: double
        semantic_key: mobile_manipulator.execute_pose.planning_pose.qx
        description: "Normalized planning pose quaternion x component."
      - name: planning_qy
        type: double
        semantic_key: mobile_manipulator.execute_pose.planning_pose.qy
        description: "Normalized planning pose quaternion y component."
      - name: planning_qz
        type: double
        semantic_key: mobile_manipulator.execute_pose.planning_pose.qz
        description: "Normalized planning pose quaternion z component."
      - name: planning_qw
        type: double
        semantic_key: mobile_manipulator.execute_pose.planning_pose.qw
        description: "Normalized planning pose quaternion w component."
      - name: base_target_frame
        type: string
        semantic_key: mobile_manipulator.execute_pose.base_target_frame
        description: "Frame of the returned base target pose."
      - name: base_target_pose_valid
        type: bool
        semantic_key: mobile_manipulator.execute_pose.base_target_pose_valid
        description: "Whether the returned base target pose is valid."
      - name: base_target_x
        type: double
        semantic_key: mobile_manipulator.execute_pose.base_target_pose.x
        description: "Returned base target pose x position."
      - name: base_target_y
        type: double
        semantic_key: mobile_manipulator.execute_pose.base_target_pose.y
        description: "Returned base target pose y position."
      - name: base_target_z
        type: double
        semantic_key: mobile_manipulator.execute_pose.base_target_pose.z
        description: "Returned base target pose z position."
      - name: base_target_qx
        type: double
        semantic_key: mobile_manipulator.execute_pose.base_target_pose.qx
        description: "Returned base target pose quaternion x component."
      - name: base_target_qy
        type: double
        semantic_key: mobile_manipulator.execute_pose.base_target_pose.qy
        description: "Returned base target pose quaternion y component."
      - name: base_target_qz
        type: double
        semantic_key: mobile_manipulator.execute_pose.base_target_pose.qz
        description: "Returned base target pose quaternion z component."
      - name: base_target_qw
        type: double
        semantic_key: mobile_manipulator.execute_pose.base_target_pose.qw
        description: "Returned base target pose quaternion w component."
      - name: candidate_score
        type: double
        semantic_key: mobile_manipulator.execute_pose.candidate_score
        description: "Score assigned to the selected candidate solution."
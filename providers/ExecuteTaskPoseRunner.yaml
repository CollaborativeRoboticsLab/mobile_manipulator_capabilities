%YAML 1.1
---
name: ExecuteTaskPoseRunner
spec_type: provider
spec_version: 1.2
description: "The provider for full mobile-manipulator fallback execution: feasibility check, optional base reposition, re-check, and arm execution."
implements: mobile_manipulator_capabilities/ExecuteTaskPoseRunner
runner: capabilities2_runner::ExecuteTaskPoseRunner

definition:
  command: "<Runner interface=mobile_manipulator_capabilities/ExecuteTaskPoseRunner provider=mobile_manipulator_capabilities/ExecuteTaskPoseRunner x='$x' y='$y' z='$z' qx='$qx' qy='$qy' qz='$qz' qw='$qw' frame_id='$frame_id' mode='$mode' />"
  configuration_parameters:
    - name: x
      type: double
      semantic_key: mobile_manipulator.execute_pose.x
      description: "Target x position in the supplied frame."
    - name: y
      type: double
      semantic_key: mobile_manipulator.execute_pose.y
      description: "Target y position in the supplied frame."
    - name: z
      type: double
      semantic_key: mobile_manipulator.execute_pose.z
      description: "Target z position in the supplied frame."
    - name: qx
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.qx
      description: "Target orientation quaternion x component."
    - name: qy
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.qy
      description: "Target orientation quaternion y component."
    - name: qz
      type: double
      optional: true
      default: 0.0
      semantic_key: mobile_manipulator.execute_pose.qz
      description: "Target orientation quaternion z component."
    - name: qw
      type: double
      optional: true
      default: 1.0
      semantic_key: mobile_manipulator.execute_pose.qw
      description: "Target orientation quaternion w component."
    - name: frame_id
      type: string
      optional: true
      default: "map"
      semantic_key: mobile_manipulator.execute_pose.frame_id
      description: "Frame in which the target pose is expressed."
    - name: mode
      type: string
      optional: true
      default: "mobile_manipulator"
      semantic_key: mobile_manipulator.execute_pose.mode
      description: "Execution mode, typically mobile_manipulator."
  runtime_parameters:
    output:
      - name: message
        type: string
        semantic_key: mobile_manipulator.execute_pose.message
        description: "Human-readable execution outcome message."
      - name: failure_reason
        type: string
        semantic_key: mobile_manipulator.execute_pose.failure_reason
        description: "Machine-readable failure reason when execution fails."
      - name: stage
        type: string
        semantic_key: mobile_manipulator.execute_pose.stage
        description: "Stage at which the runner succeeded or failed."